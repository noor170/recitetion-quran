<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surah Al-Ikhlas | Studio Reciter & Practice App</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- LameJS MP3 Encoder -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>

  <style>
    :root {
      --primary: #0d9488;
      --primary-hover: #0f766e;
      --primary-light: rgba(13, 148, 136, 0.15);
      --accent: #d97706;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-light: rgba(239, 68, 68, 0.15);
      --success: #10b981;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #475569;
      --radius-lg: 24px;
      --radius-md: 14px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --shadow-md: 0 10px 30px rgba(0,0,0,0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 1.5rem 1rem 3rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-card {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      position: relative;
    }

    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      position: relative;
    }

    .header-actions {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.35rem 0.85rem;
      background: var(--primary-light);
      color: #2dd4bf;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-mode {
      background: rgba(2, 132, 199, 0.2);
      color: #38bdf8;
    }

    body.mode-record .badge-mode {
      background: var(--danger-light);
      color: #f87171;
    }

    .header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .bismillah {
      font-family: 'Amiri Quran', serif;
      font-size: 2rem;
      color: #2dd4bf;
      text-align: center;
      line-height: 2.2;
      margin-top: 0.5rem;
    }

    .settings-btn {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .settings-btn:hover {
      background: #475569;
    }

    .settings-menu {
      display: none;
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      flex-direction: column;
      gap: 1rem;
      animation: fadeIn 0.2s ease-in-out;
    }

    .settings-menu.active {
      display: flex;
    }

    .settings-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .switch-row {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      color: var(--text-main);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--border);
      border-radius: 9999px;
      transition: background-color 0.2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      top: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    .switch input:checked + .slider {
      background-color: var(--primary);
    }

    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }

    .form-input, .qari-select {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
    }

    .qiraat-banner {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .qiraat-info {
      display: flex;
      flex-direction: column;
    }

    .qiraat-info span {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .qiraat-info strong {
      font-size: 0.95rem;
      color: #2dd4bf;
    }

    .verse-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .verse-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      background: var(--surface-card);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .verse-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .verse-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arabic-text {
      font-family: 'Amiri Quran', serif;
      font-size: 1.65rem;
      direction: rtl;
      text-align: right;
      color: #f8fafc;
      line-height: 2;
    }

    .translation-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .transliteration {
      font-size: 0.95rem;
      font-weight: 600;
      color: #2dd4bf;
    }

    .translation {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .timeline-container {
      display: none;
      flex-direction: column;
      gap: 0.4rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.75rem;
      border-radius: 10px;
      border: 1px solid rgba(71, 85, 105, 0.5);
    }

    .timeline-container.active {
      display: flex;
    }

    .timeline-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .scrubber-wrapper {
      position: relative;
      height: 32px;
      display: flex;
      align-items: center;
    }

    .waveform-canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      opacity: 0.4;
    }

    .timeline-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #475569;
      border-radius: 4px;
      outline: none;
      position: relative;
      z-index: 2;
      cursor: pointer;
    }

    .timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #2dd4bf;
      box-shadow: 0 0 10px rgba(45, 212, 191, 0.8);
      cursor: pointer;
    }

    .controls-row {
      display: flex;
      gap: 0.75rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-secondary {
      background-color: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .btn-qiraat {
      background-color: var(--accent);
      color: white;
      white-space: nowrap;
    }

    .btn-record {
      background-color: var(--primary);
      color: #ffffff;
    }

    .loop-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .btn-loop {
      flex: 0 0 auto;
      background-color: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.5rem 0.85rem;
      font-size: 0.8rem;
    }

    .btn-loop.active {
      background-color: rgba(217, 119, 6, 0.2);
      border-color: var(--accent);
      color: #f59e0b;
    }

    .loop-time {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .loop-time input {
      width: 60px;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
    }

    .speed-controls {
      display: flex;
      gap: 0.4rem;
    }

    .speed-btn {
      flex: 1;
      background-color: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .speed-btn.active {
      background-color: rgba(13, 148, 136, 0.2);
      border-color: var(--primary);
      color: #2dd4bf;
    }

    .assessment-row {
      display: flex;
      gap: 0.75rem;
      padding-top: 0.25rem;
    }

    .btn-mastered {
      background-color: var(--surface);
      color: var(--text-muted);
      border: 2px solid var(--border);
    }

    .btn-mastered.active {
      background-color: rgba(16, 185, 129, 0.25);
      border-color: var(--success);
      color: #34d399;
      font-weight: 800;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.35);
    }

    .btn-needs {
      background-color: var(--surface);
      color: var(--text-muted);
      border: 2px solid var(--border);
    }

    .btn-needs.active {
      background-color: rgba(217, 119, 6, 0.25);
      border-color: var(--accent);
      color: #f59e0b;
      font-weight: 800;
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.35);
    }

    .btn-icon {
      flex: 0 0 auto;
      padding: 0.65rem 0.8rem;
      min-width: 44px;
      justify-content: center;
    }

    .btn-needs.btn-icon {
      padding: 0.32rem 0.4rem;
      min-width: 22px;
      font-size: 0.7rem;
    }

    .btn-record.recording {
      background-color: var(--danger);
      animation: pulse-red 1.5s infinite;
    }

    .btn-record.has-recording {
      background-color: var(--success);
    }

    .btn-record-main {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      font-size: 1.05rem;
      padding: 1rem 1.5rem;
      width: 100%;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.35);
    }

    .btn-export {
      background-color: #059669;
      color: white;
    }

    .btn-clear {
      background-color: #64748b;
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    body.mode-listen .practice-only,
    body.mode-listen .record-only,
    body.mode-record .listen-only,
    body.mode-record .practice-only,
    body.mode-record .controls-row {
      display: none !important;
    }

    body.mode-practice .record-only {
      display: none !important;
    }

    .actions-footer {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--surface-card);
      padding: 1.25rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
    }

    .btn-primary {
      background-color: #3b82f6;
      color: white;
    }

    .btn-primary.playing {
      background-color: var(--danger);
    }

    .status-badge {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .recording-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .recording-overlay.active {
      display: flex;
    }

    .mic-container {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .mic-halo {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.2);
      transform: scale(1);
      transition: transform 0.05s ease-out;
    }

    .mic-icon-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      z-index: 2;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
    }

    .visualizer-canvas {
      width: 280px;
      height: 60px;
      margin-bottom: 1.5rem;
    }

    .rec-timer {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      font-family: monospace;
      margin-bottom: 2rem;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #1e293b;
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 9999;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="mode-practice">

  <div class="app-card">
    <header class="header">
      <div class="header-actions">
        <button class="settings-btn" onclick="toggleSettingsMenu()" title="Settings">⚙️</button>
      </div>

      <div class="badge-group">
        <span id="surahBadge" class="badge">Chapter 112 • Al-Ikhlas</span>
        <span id="appModeBadge" class="badge badge-mode">Practice Mode</span>
      </div>
      <h1 id="surahTitle">Surah Al-Ikhlas</h1>
      <div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
    </header>

    <footer class="record-only" style="display: flex; flex-direction: column; gap: 1rem;">
      <button id="masterRecordBtn" class="btn btn-record-main" onclick="startMasterStudioRecording()">
        🎙 Start Full Recitation Recording
      </button>

      <div id="studioRecordingResult" style="display: none; background: var(--surface-card); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border); flex-direction: column; gap: 0.85rem;">
        <span style="font-weight: 700; color: #2dd4bf; font-size: 0.9rem;">Studio Recitation Recorded</span>
        <audio id="studioAudioPlayback" controls style="width: 100%; border-radius: 8px;"></audio>
        <div style="display: flex; gap: 0.75rem;">
          <button class="btn btn-export" style="flex:1;" onclick="exportStudioMp3()">💾 Export MP3</button>
          <button class="btn btn-secondary" onclick="resetStudioRecording()">🗑 Delete & Retry</button>
        </div>
      </div>
    </footer>

    <div id="settingsMenu" class="settings-menu">
      <div class="settings-title">
        <span>⚙️ App Settings</span>
        <button style="background:none; border:none; color: white; cursor:pointer;" onclick="toggleSettingsMenu()">❌</button>
      </div>

      <div class="form-group">
        <label for="modeSelect">App Mode:</label>
        <select id="modeSelect" class="qari-select" onchange="changeAppMode(this.value)">
          <option value="practice">Practice Mode (Listen & Record Verse-by-Verse)</option>
          <option value="listen">Listen Only Mode</option>
          <option value="record">Record Only Mode (Studio Full Recitation)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="surahSelect">Select Surah:</label>
        <select id="surahSelect" class="qari-select" onchange="loadSurahData(this.value)">
          <option value="112">Loading Surahs...</option>
        </select>
      </div>

      <div class="form-group">
        <label>Reference Speed:</label>
        <div class="speed-controls">
          <button type="button" class="speed-btn" onclick="setReferenceSpeed(0.75, this)">0.75×</button>
          <button type="button" class="speed-btn active" onclick="setReferenceSpeed(1.0, this)">1.0×</button>
          <button type="button" class="speed-btn" onclick="setReferenceSpeed(1.25, this)">1.25×</button>
        </div>
      </div>

      <div class="form-group">
        <label class="switch-row" for="autoplaySwitch">
          <span>🔄 Autoplay (Practice Mode)</span>
          <label class="switch">
            <input type="checkbox" id="autoplaySwitch" onchange="setAutoplay(this.checked)">
            <span class="slider"></span>
          </label>
        </label>
      </div>

      <div class="form-group listen-only">
        <label for="qariSelect">Select Preferred Qari:</label>
        <select id="qariSelect" class="qari-select" onchange="updateSelectedQari()">
          <option value="ar.alafasy">Mishary Rashid Alafasy</option>
          <option value="ar.husary">Mahmoud Khalil Al-Husary</option>
          <option value="ar.minshawi">Mohamed Siddiq El-Minshawi</option>
        </select>
      </div>
    </div>

    <section class="qiraat-banner listen-only">
      <div class="qiraat-info">
        <span>Active Reference Qari</span>
        <strong id="activeQariLabel">Mishary Rashid Alafasy</strong>
      </div>
      <button id="qiraatPlayBtn" class="btn btn-qiraat" onclick="toggleContinuousQiraat()">
        ▶ Play Full Qira'at
      </button>
    </section>

    <main class="verse-list">
      <!-- Verse cards injected dynamically via JS -->
    </main>

    <footer class="actions-footer practice-only">
      <div class="btn-group">
        <button id="fullPlayBtn" class="btn btn-primary" disabled onclick="toggleFullSurah()">
          ▶ Play Full Personal Recitation
        </button>
        <button id="saveMp3Btn" class="btn btn-export" disabled onclick="exportToMp3()">
          💾 Export MP3
        </button>
        <button id="clearBtn" class="btn btn-clear" onclick="clearStorage()">
          🗑 Reset Audio
        </button>
      </div>

      <div id="statusMsg" class="status-badge">Record all 4 verses to enable full recitation & MP3 export.</div>
      <div id="assessmentProgress" class="status-badge">Mastered: 0/0 | Needs Practice: 0/0</div>
    </footer>

  </div>

  <div id="recordingOverlay" class="recording-overlay">
    <div class="mic-container">
      <div id="micHalo" class="mic-halo"></div>
      <div class="mic-icon-circle">🎙</div>
    </div>
    <canvas id="visualizer" class="visualizer-canvas"></canvas>
    <div id="recTimer" class="rec-timer">00:00</div>
    <button class="btn btn-record-main" style="max-width: 250px;" onclick="stopMasterStudioRecording()">
      ⏹ Complete Recording
    </button>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let currentAudio = null;
    let currentPlaybackState = null;
    let isPaused = false;
    let currentVerseIndex = 0;
    let activeQariIdentifier = 'ar.alafasy';
    let isAutoplayEnabled = true;
    let autoplayTimer = null;
    let playbackUpdateFrame = null;

    let mediaRecorder = null;
    let audioChunks = [];
    let recordingVerse = null;
    let autoStopTimer = null;
    let currentAutoplayVerse = 1;
    let isReviewingPhase = false;
    let currentReferenceDuration = 3000; // Default fallback (3 seconds)
    let autoStopRecordingTimer = null;
    let countdownInterval = null;
    let loopConfig = {}; // verseNum -> { active, start, end } for A/B micro-loop rehearse
    let referencePlaybackRate = 1.0; // playback speed for reference Qari audio
    let assessmentStatus = {}; // verseNum -> 'mastered' | 'needs_practice' | null (self-assessment)

    let recordedBlobs = {};
    let recordedUrls = {};
    let db = null;

    let currentSurah = 112;
    let totalVerses = 4;
    let verseAudioUrls = {};
    let verseArabic = {};
    let verseTranslation = {};
    const recKey = (v) => `${currentSurah}_${v}`;

    let studioAudioCtx = null;
    let studioAnalyser = null;
    let studioMicStream = null;
    let studioTimerInterval = null;
    let studioStartTime = 0;
    let studioMasterBlob = null;
    let visualizerFrame = null;

    function setAutoplay(enabled) {
      isAutoplayEnabled = enabled;
      const autoSwitch = document.getElementById('autoplaySwitch');
      if (autoSwitch) autoSwitch.checked = enabled;

      if (enabled) {
        showToast('Autoplay Enabled: Continuous practice cycle active.');
      } else {
        if (autoplayTimer) clearTimeout(autoplayTimer);
        showToast('Autoplay Disabled.');
      }
    }

    function toggleSettingsMenu() {
      document.getElementById('settingsMenu').classList.toggle('active');
    }

    function changeAppMode(mode) {
      stopAllPlayback(true);
      const modeSelect = document.getElementById('modeSelect');
      const modeBadge = document.getElementById('appModeBadge');

      modeSelect.value = mode;
      document.body.classList.remove('mode-practice', 'mode-listen', 'mode-record');

      if (mode === 'listen') {
        document.body.classList.add('mode-listen');
        modeBadge.textContent = 'Listen Mode';
      } else if (mode === 'record') {
        document.body.classList.add('mode-record');
        modeBadge.textContent = 'Record Mode';
      } else {
        document.body.classList.add('mode-practice');
        modeBadge.textContent = 'Practice Mode';
      }
    }

    function updateSelectedQari() {
      stopAllPlayback(true);
      const select = document.getElementById('qariSelect');
      activeQariIdentifier = select.value;
      const selectedName = select.options[select.selectedIndex].text;
      document.getElementById('activeQariLabel').textContent = selectedName;
      loadSurahData(currentSurah);
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function stopAllPlayback(resetPosition = false) {
      if (playbackUpdateFrame) cancelAnimationFrame(playbackUpdateFrame);
      if (autoplayTimer) clearTimeout(autoplayTimer);
      if (autoStopTimer) clearInterval(autoStopTimer); // Clears countdown interval
      if (autoStopRecordingTimer) clearTimeout(autoStopRecordingTimer); // Clears auto-stop recording timer
      if (countdownInterval) clearInterval(countdownInterval); // Clears live countdown UI timer

      if (currentAudio) {
        currentAudio.pause();
        if (resetPosition) currentAudio = null;
      }

      if (resetPosition) {
        currentPlaybackState = null;
        isPaused = false;
        currentVerseIndex = 0;

        const qiraatBtn = document.getElementById('qiraatPlayBtn');
        if (qiraatBtn) {
          qiraatBtn.innerHTML = '▶ Play Full Qira\'at';
          qiraatBtn.classList.remove('playing');
        }

        const fullPlayBtn = document.getElementById('fullPlayBtn');
        if (fullPlayBtn) {
          fullPlayBtn.innerHTML = '▶ Play Full Personal Recitation';
          fullPlayBtn.classList.remove('playing');
        }

        for (let i = 1; i <= totalVerses; i++) {
          const refBtn = document.getElementById(`ref-btn-${i}`);
          if (refBtn) refBtn.innerHTML = '▶ Tilawat';

          const recBtn = document.getElementById(`rec-btn-${i}`);
          if (recBtn) {
            recBtn.classList.remove('recording');
            if (recordedUrls[i]) {
              recBtn.innerHTML = '🔊 Listen Back';
            } else {
              recBtn.innerHTML = '🎙 Record';
            }
          }
        }
      }
    }

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('SurahAudioDB', 1);
        request.onupgradeneeded = event => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains('recordings')) {
            db.createObjectStore('recordings');
          }
        };

        request.onsuccess = event => {
          db = event.target.result;
          resolve(db);
        };
        request.onerror = event => reject(event.target.error);
      });
    }

    function saveBlobToDB(key, blob) {
      if (!db) return;
      const transaction = db.transaction(['recordings'], 'readwrite');
      transaction.objectStore('recordings').put(blob, key);
    }

    function loadRecordingsFromDB() {
      if (!db) return;
      const transaction = db.transaction(['recordings'], 'readonly');
      const store = transaction.objectStore('recordings');

      for (let verseNum = 1; verseNum <= totalVerses; verseNum++) {
        const request = store.get(recKey(verseNum));
        request.onsuccess = event => {
          const blob = event.target.result;
          if (blob) {
            recordedBlobs[verseNum] = blob;
            recordedUrls[verseNum] = URL.createObjectURL(blob);

            const tl = document.getElementById(`timeline-${verseNum}`);
            if (tl) tl.classList.add('active');
            drawStaticWaveform(verseNum, blob);

            const btn = document.getElementById(`rec-btn-${verseNum}`);
            if (btn) {
              btn.innerHTML = '🔊 Listen Back';
              btn.classList.add('has-recording');
            }
            checkFullSurahReady();
          }
        };
      }

      const studioReq = store.get('studioMasterBlob');
      studioReq.onsuccess = event => {
        const blob = event.target.result;
        if (blob) {
          studioMasterBlob = blob;
          document.getElementById('studioAudioPlayback').src = URL.createObjectURL(blob);
          document.getElementById('masterRecordBtn').style.display = 'none';
          document.getElementById('studioRecordingResult').style.display = 'flex';
        }
      };
    }

    function clearStorage() {
      stopAllPlayback(true);
      if (!db) return;
      const transaction = db.transaction(['recordings'], 'readwrite');
      transaction.objectStore('recordings').clear();

      recordedBlobs = {};
      recordedUrls = {};

      for (let verseNum = 1; verseNum <= totalVerses; verseNum++) {
        const btn = document.getElementById(`rec-btn-${verseNum}`);
        if (btn) {
          btn.innerHTML = '🎙 Record';
          btn.classList.remove('has-recording', 'recording');
        }
        document.getElementById(`timeline-${verseNum}`).classList.remove('active');
      }

      resetStudioRecording();
      checkFullSurahReady();
      showToast('Audio reset complete.');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const autoSwitch = document.getElementById('autoplaySwitch');
      if (autoSwitch) autoSwitch.checked = isAutoplayEnabled;
      initDB().then(async () => {
        try {
          await populateSurahList();
        } catch (e) { /* toast already shown */ }
        await loadSurahData(currentSurah);
      });
    });

    async function populateSurahList() {
      const select = document.getElementById('surahSelect');
      if (!select) return;
      try {
        const res = await fetch('https://api.alquran.cloud/v1/surah');
        if (!res.ok) throw new Error('Failed to load Surah list');
        const data = await res.json();
        select.innerHTML = '';
        data.data.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.number;
          opt.textContent = `${s.number}. ${s.englishName} (${s.name})`;
          select.appendChild(opt);
        });
        select.value = currentSurah;
      } catch (err) {
        showToast('Failed to load Surah list. Please check your connection.');
      }
    }

    async function loadSurahData(surahNumber) {
      stopAllPlayback(true);
      const select = document.getElementById('surahSelect');
      if (select) select.value = surahNumber;

      try {
        const url = `https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,en.sahih,${activeQariIdentifier}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Failed to load Surah data');
        const data = await res.json();
        const editions = data.data; // [uthmani, en.sahih, audio]
        const uthmani = editions[0];
        const translation = editions[1];
        const audio = editions[2];

        currentSurah = parseInt(surahNumber, 10);
        totalVerses = uthmani.numberOfAyahs;
        verseAudioUrls = {};
        verseArabic = {};
        verseTranslation = {};

        uthmani.ayahs.forEach((ayah, idx) => {
          const v = ayah.numberInSurah;
          verseArabic[v] = ayah.text;
          verseTranslation[v] = translation.ayahs[idx].text;
          verseAudioUrls[v] = audio.ayahs[idx].audio;
        });

        // Reset in-memory recordings for the newly loaded Surah
        recordedBlobs = {};
        recordedUrls = {};

        renderVerseCards();
        updateSurahHeader(uthmani);
        loadRecordingsFromDB();

        showToast(`Loaded Surah ${currentSurah}`);
      } catch (err) {
        showToast('Failed to load Surah. Please check your connection.');
      }
    }

    function renderVerseCards() {
      const container = document.querySelector('.verse-list');
      if (!container) return;

      let html = '';
      for (let v = 1; v <= totalVerses; v++) {
        html += `
      <article class="verse-card">
        <div class="verse-header">
          <span class="verse-badge">${v}</span>
          <div class="arabic-text">${verseArabic[v]}</div>
        </div>
        <div class="translation-group">
          <div class="translation">${verseTranslation[v]}</div>
        </div>

        <div class="loop-controls">
          <button id="loop-btn-${v}" class="btn btn-loop" onclick="toggleLoopVerse(${v}, this)" title="Loop a section to rehearse">
            🔁 Loop Verse
          </button>
          <label class="loop-time">A <input type="number" id="loop-start-${v}" min="0" step="0.5" value="0" onchange="updateLoopTiming(${v})"></label>
          <label class="loop-time">B <input type="number" id="loop-end-${v}" min="0" step="0.5" value="0" onchange="updateLoopTiming(${v})"></label>
        </div>

        <div id="timeline-${v}" class="timeline-container practice-only">
          <div class="timeline-meta">
            <span>Visual Backtracking Timeline</span>
            <span id="timer-badge-${v}">00:00 / 00:00</span>
          </div>
          <div class="scrubber-wrapper">
            <canvas id="wave-canvas-${v}" class="waveform-canvas"></canvas>
            <input type="range" id="scrubber-${v}" class="timeline-slider" value="0" min="0" max="100" step="0.1" oninput="seekRecording(${v}, this.value)">
          </div>
        </div>

        <div class="controls-row">
          <button id="ref-btn-${v}" class="btn btn-secondary listen-only" onclick="playSingleVerseQiraat(${v}, this)">
            ▶ Tilawat
          </button>
          <button id="rec-btn-${v}" class="btn btn-record practice-only" onclick="toggleRecord(${v}, this)">
            🎙 Record
          </button>
          <button id="master-btn-${v}" class="btn btn-mastered btn-icon" onclick="toggleAssessment(${v}, 'mastered', this)" title="Mastered">
            ✅
          </button>
          <button id="needsp-btn-${v}" class="btn btn-needs btn-icon" onclick="toggleAssessment(${v}, 'needs_practice', this)" title="Needs Practice">
            ⚠️
          </button>

      </article>`;
      }
      container.innerHTML = html;

    function updateSurahHeader(surahMeta) {
      const badge = document.getElementById('surahBadge');
      const title = document.getElementById('surahTitle');
      if (badge) badge.textContent = `Chapter ${surahMeta.number} • ${surahMeta.englishName}`;
      if (title) title.textContent = `Surah ${surahMeta.englishName}`;
      document.title = `Surah ${surahMeta.englishName} | Studio Reciter & Practice App`;
    }

    function playSingleVerseQiraat(verseNum, btn) {
      const stateKey = `ref-${verseNum}`;
      const audioUrl = verseAudioUrls[verseNum];

      if (currentPlaybackState === stateKey && !isPaused && currentAudio) {
        currentAudio.pause();
        isPaused = true;
        btn.innerHTML = '▶ Resume Tilawat';
        return;
      }

      stopAllPlayback(true);
      currentPlaybackState = stateKey;
      isPaused = false;

      currentAudio = new Audio(audioUrl);
      currentAudio.playbackRate = referencePlaybackRate;
      btn.innerHTML = '⏸ Pause Tilawat';

      currentAudio.onloadedmetadata = () => {
        if (currentAudio.duration && !isNaN(currentAudio.duration)) {
          currentReferenceDuration = currentAudio.duration * 1000;
        }
      };

      currentAudio.ontimeupdate = () => handleLoopTimeUpdate(verseNum);

      currentAudio.play();

      currentAudio.onended = () => {
        stopAllPlayback(true);
        const recBtn = document.getElementById(`rec-btn-${verseNum}`);
        if (recBtn) {
          toggleRecord(verseNum, recBtn);
        }
      };
    }

    function toggleContinuousQiraat() {
      const qiraatBtn = document.getElementById('qiraatPlayBtn');

      if (currentPlaybackState === 'fullQiraat' && currentAudio && !currentAudio.paused) {
        currentAudio.pause();
        isPaused = true;
        qiraatBtn.classList.remove('playing');
        qiraatBtn.innerHTML = `▶ Resume Qira'at (Verse ${currentVerseIndex + 1})`;
        return;
      }

      if (currentPlaybackState === 'fullQiraat' && isPaused && currentAudio) {
        currentAudio.play();
        isPaused = false;
        qiraatBtn.classList.add('playing');
        qiraatBtn.innerHTML = `⏸ Pause Qira'at (Verse ${currentVerseIndex + 1})`;
        return;
      }

      stopAllPlayback(true);
      currentPlaybackState = 'fullQiraat';
      isPaused = false;
      currentVerseIndex = 0;
      qiraatBtn.classList.add('playing');

      function playNext() {
        if (currentVerseIndex >= totalVerses || currentPlaybackState !== 'fullQiraat') {
          stopAllPlayback(true);
          return;
        }

        const url = verseAudioUrls[currentVerseIndex + 1];
        qiraatBtn.innerHTML = `⏸ Pause Qira'at (Verse ${currentVerseIndex + 1})`;
        currentAudio = new Audio(url);
        currentAudio.play();
        currentAudio.onended = () => {
          currentVerseIndex++;
          playNext();
        };
      }
      playNext();
    }

    async function toggleRecord(verseNum, btn) {
      const stateKey = `user-${verseNum}`;

      if (recordingVerse === verseNum && mediaRecorder && mediaRecorder.state === "recording") {
        clearRecordingTimers();
        mediaRecorder.stop();
        return;
      }

      if (recordedUrls[verseNum] && !btn.classList.contains('recording')) {
        if (currentPlaybackState === stateKey && !isPaused && currentAudio) {
          currentAudio.pause();
          isPaused = true;
          btn.innerHTML = '▶ Resume Voice';
          return;
        }

        stopAllPlayback(true);
        currentPlaybackState = stateKey;
        isPaused = false;

        currentAudio = new Audio(recordedUrls[verseNum]);
        btn.innerHTML = '⏸ Pause Voice';
        currentAudio.play();
        trackTimelineProgress(verseNum);

        currentAudio.onended = () => {
          stopAllPlayback(true);
          resetTimelineScrubber(verseNum);
        };
        return;
      }

      try {
        stopAllPlayback(true);

        // Disable the A/B micro-loop so the take is captured over the full track
        if (loopConfig[verseNum] && loopConfig[verseNum].active) {
          loopConfig[verseNum].active = false;
          const loopBtn = document.getElementById(`loop-btn-${verseNum}`);
          if (loopBtn) loopBtn.classList.remove('active');
        }

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          clearRecordingTimers();

          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          recordedBlobs[verseNum] = audioBlob;
          recordedUrls[verseNum] = URL.createObjectURL(audioBlob);
          saveBlobToDB(recKey(verseNum), audioBlob);

          document.getElementById(`timeline-${verseNum}`).classList.add('active');
          drawStaticWaveform(verseNum, audioBlob);

          btn.innerHTML = '🔊 Listen Back';
          btn.classList.remove('recording');
          btn.classList.add('has-recording');
          recordingVerse = null;
          checkFullSurahReady();
          stream.getTracks().forEach(track => track.stop());

          if (isAutoplayEnabled) {
            currentAutoplayVerse = verseNum + 1;
            setTimeout(runAutoplayLoop, 800);
          } else {
            playRecordedVoice(verseNum);
          }
        };

        mediaRecorder.start();
        recordingVerse = verseNum;
        btn.classList.add('recording');

        // Calculate total seconds to record based on reference tilawat
        let remainingSeconds = Math.ceil(currentReferenceDuration / 1000);
        btn.innerHTML = `🎙 Recording (${remainingSeconds}s remaining)`;

        // Countdown UI timer
        countdownInterval = setInterval(() => {
          remainingSeconds--;
          if (remainingSeconds > 0) {
            btn.innerHTML = `🎙 Recording (${remainingSeconds}s remaining)`;
          } else {
            btn.innerHTML = `🎙 Finalizing...`;
          }
        }, 1000);

        // Auto-stop timeout matching reference tilawat duration
        autoStopRecordingTimer = setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        }, currentReferenceDuration);

      } catch (err) {
        showToast('Microphone access denied.');
      }
    }

    // Helper to clear running timers safely
    function clearRecordingTimers() {
      if (autoStopRecordingTimer) {
        clearTimeout(autoStopRecordingTimer);
        autoStopRecordingTimer = null;
      }
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
    }

    // 2. Play single recorded voice
    function playRecordedVoice(verseNum, onCompleteCallback) {
      if (!recordedUrls[verseNum]) return;

      stopAllPlayback(true);
      currentPlaybackState = `user-${verseNum}`;

      const btn = document.getElementById(`rec-btn-${verseNum}`);
      if (btn) btn.innerHTML = '⏸ Voice Recording';

      currentAudio = new Audio(recordedUrls[verseNum]);
      currentAudio.play();
      trackTimelineProgress(verseNum);

      currentAudio.onended = () => {
        resetTimelineScrubber(verseNum);
        if (btn) btn.innerHTML = '🔊 Listen Back';
        if (onCompleteCallback) onCompleteCallback();
      };
    }

    // 3. Reference Tilawat Player (Captures Exact Duration)
    function playReferenceVerse(verseNum, onCompleteCallback) {
      const audioUrl = verseAudioUrls[verseNum];
      stopAllPlayback(true);
      currentPlaybackState = `ref-${verseNum}`;

      const btn = document.getElementById(`ref-btn-${verseNum}`);
      if (btn) btn.innerHTML = '⏸ Tilawat';

      currentAudio = new Audio(audioUrl);
      currentAudio.playbackRate = referencePlaybackRate;

      // Capture audio metadata to determine exact recording duration
      currentAudio.onloadedmetadata = () => {
        if (currentAudio.duration && !isNaN(currentAudio.duration)) {
          currentReferenceDuration = currentAudio.duration * 1000; // Convert to ms
        }
      };

      currentAudio.ontimeupdate = () => handleLoopTimeUpdate(verseNum);

      currentAudio.play();

      currentAudio.onended = () => {
        if (btn) btn.innerHTML = '▶ Tilawat';
        if (onCompleteCallback) onCompleteCallback();
      };
    }

    // A/B Micro-Loop: toggle rehearsal looping for a verse's reference track
    function toggleLoopVerse(verseNum, btn) {
      if (!loopConfig[verseNum]) loopConfig[verseNum] = { active: false, start: 0, end: 0 };
      loopConfig[verseNum].active = !loopConfig[verseNum].active;
      btn.classList.toggle('active', loopConfig[verseNum].active);

      if (loopConfig[verseNum].active) {
        // Start the reference playback (loop applies while it plays)
        const refBtn = document.getElementById(`ref-btn-${verseNum}`);
        if (refBtn) playSingleVerseQiraat(verseNum, refBtn);
        showToast(`Loop Verse ${verseNum} ON — rehearsing section.`);
      } else {
        showToast(`Loop Verse ${verseNum} OFF — resuming full playback.`);
      }
    }

    function updateLoopTiming(verseNum) {
      const startEl = document.getElementById(`loop-start-${verseNum}`);
      const endEl = document.getElementById(`loop-end-${verseNum}`);
      const start = parseFloat(startEl && startEl.value) || 0;
      const end = parseFloat(endEl && endEl.value) || 0;
      if (!loopConfig[verseNum]) loopConfig[verseNum] = { active: false, start: 0, end: 0 };
      loopConfig[verseNum].start = start;
      loopConfig[verseNum].end = end;
    }

    function handleLoopTimeUpdate(verseNum) {
      if (!currentAudio || currentPlaybackState !== `ref-${verseNum}`) return;
      const cfg = loopConfig[verseNum];
      if (!cfg || !cfg.active) return;

      const end = cfg.end > 0 ? cfg.end : (currentAudio.duration || 0);
      const start = cfg.start || 0;

      // Reset playhead to start when reaching the loop end (A/B micro-loop)
      if (currentAudio.currentTime >= end) {
        currentAudio.currentTime = start;
      }
    }

    // Reference playback speed control (0.75×, 1.0×, 1.25×)
    function setReferenceSpeed(rate, btn) {
      referencePlaybackRate = rate;
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', b === btn));
      // Apply live to the currently playing reference audio
      if (currentAudio && currentPlaybackState && currentPlaybackState.startsWith('ref-')) {
        currentAudio.playbackRate = rate;
      }
      showToast(`Reference speed set to ${rate}×`);
    }

    // 4. Automated Practice Cycle Controller
    function runAutoplayLoop() {
      if (!isAutoplayEnabled) return;

      // Phase 1 (Learn & Record): Reference -> Auto-Record -> Next
      if (!isReviewingPhase && currentAutoplayVerse <= totalVerses) {
        playReferenceVerse(currentAutoplayVerse, () => {
          const recBtn = document.getElementById(`rec-btn-${currentAutoplayVerse}`);
          toggleRecord(currentAutoplayVerse, recBtn);
        });
        return;
      }

      // Phase 1 Transition: Full Combined Recitation -> Transition to Phase 2
      if (!isReviewingPhase && currentAutoplayVerse > totalVerses) {
        isReviewingPhase = true;
        showToast('Phase 1 Complete! Playing full combined recitation...');
        toggleFullSurah();

        currentAudio.onended = () => {
          currentAutoplayVerse = 1;
          setTimeout(runAutoplayLoop, 1000);
        };
        return;
      }

      // Phase 2 (Review Cycle): Reference -> Play Voice -> Next
      if (isReviewingPhase && currentAutoplayVerse <= totalVerses) {
        const vNum = currentAutoplayVerse;
        playReferenceVerse(vNum, () => {
          playRecordedVoice(vNum, () => {
            currentAutoplayVerse++;
            runAutoplayLoop();
          });
        });
        return;
      }

      // Phase 2 Completion: Final Full Recitation
      if (isReviewingPhase && currentAutoplayVerse > totalVerses) {
        showToast('Review Cycle Complete! Playing final full recitation...');
        toggleFullSurah();
      }
    }

    // 5. Trigger start on user action
    function startAutoplayPipeline() {
      currentAutoplayVerse = 1;
      isReviewingPhase = false;
      runAutoplayLoop();
    }

    function trackTimelineProgress(verseNum) {
      const scrubber = document.getElementById(`scrubber-${verseNum}`);
      const timerBadge = document.getElementById(`timer-badge-${verseNum}`);

      function update() {
        if (currentAudio && !currentAudio.paused && currentPlaybackState === `user-${verseNum}`) {
          const progress = (currentAudio.currentTime / currentAudio.duration) * 100;
          scrubber.value = progress || 0;

          const curMins = String(Math.floor(currentAudio.currentTime / 60)).padStart(2, '0');
          const curSecs = String(Math.floor(currentAudio.currentTime % 60)).padStart(2, '0');
          const durMins = String(Math.floor((currentAudio.duration || 0) / 60)).padStart(2, '0');
          const durSecs = String(Math.floor((currentAudio.duration || 0) % 60)).padStart(2, '0');

          timerBadge.textContent = `${curMins}:${curSecs} / ${durMins}:${durSecs}`;
          playbackUpdateFrame = requestAnimationFrame(update);
        }
      }
      update();
    }

    function seekRecording(verseNum, percent) {
      if (currentAudio && currentPlaybackState === `user-${verseNum}`) {
        currentAudio.currentTime = (percent / 100) * currentAudio.duration;
      }
    }

    function resetTimelineScrubber(verseNum) {
      const scrubber = document.getElementById(`scrubber-${verseNum}`);
      if (scrubber) scrubber.value = 0;
    }

    async function drawStaticWaveform(verseNum, blob) {
      const canvas = document.getElementById(`wave-canvas-${verseNum}`);
      const ctx = canvas.getContext('2d');
      const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
      const arrayBuffer = await blob.arrayBuffer();
      const decodedData = await tempCtx.decodeAudioData(arrayBuffer);

      const rawData = decodedData.getChannelData(0);
      const samples = 60;
      const blockSize = Math.floor(rawData.length / samples);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#2dd4bf';

      for (let i = 0; i < samples; i++) {
        let blockSum = 0;
        for (let j = 0; j < blockSize; j++) {
          blockSum += Math.abs(rawData[i * blockSize + j]);
        }
        let value = blockSum / blockSize;
        let barHeight = value * canvas.height * 2.5;
        let x = i * (canvas.width / samples);
        ctx.fillRect(x, canvas.height / 2 - barHeight / 2, 2, barHeight);
      }
    }

    function checkFullSurahReady() {
      const fullPlayBtn = document.getElementById('fullPlayBtn');
      const saveMp3Btn = document.getElementById('saveMp3Btn');
      const statusMsg = document.getElementById('statusMsg');
      const count = Object.keys(recordedBlobs).length;

      if (count === totalVerses) {
        fullPlayBtn.disabled = false;
        saveMp3Btn.disabled = false;
        statusMsg.textContent = `All ${totalVerses} verses recorded! Ready for full playback & export.`;
        statusMsg.style.color = '#2dd4bf';

        if (isAutoplayEnabled && currentPlaybackState !== 'fullPersonal') {
          showToast('Waiting 10s before playing Full Recitation...');
          autoplayTimer = setTimeout(() => {
            toggleFullSurah();
          }, 10000);
        }
      } else {
        fullPlayBtn.disabled = true;
        saveMp3Btn.disabled = true;
        statusMsg.textContent = `Recorded (${count}/${totalVerses}) verses. Record all to export.`;
      }
    }

    function toggleFullSurah() {
      if (Object.keys(recordedBlobs).length < totalVerses) return;
      const fullPlayBtn = document.getElementById('fullPlayBtn');

      stopAllPlayback(true);
      currentPlaybackState = 'fullPersonal';
      currentVerseIndex = 1;
      fullPlayBtn.classList.add('playing');

      function playNextVerse() {
        if (currentVerseIndex > totalVerses || currentPlaybackState !== 'fullPersonal') {
          stopAllPlayback(true);
          return;
        }

        fullPlayBtn.innerHTML = `⏸ Pause Personal (Verse ${currentVerseIndex})`;
        currentAudio = new Audio(recordedUrls[currentVerseIndex]);
        currentAudio.play();

        trackTimelineProgress(currentVerseIndex);

        currentAudio.onended = () => {
          resetTimelineScrubber(currentVerseIndex);
          currentVerseIndex++;
          playNextVerse();
        };
      }
      playNextVerse();
    }

    function drawVisualizer() {
      if (!studioAnalyser) return;
      const canvas = document.getElementById('visualizer');
      const ctx = canvas.getContext('2d');
      const micHalo = document.getElementById('micHalo');
      const bufferLength = studioAnalyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function render() {
        visualizerFrame = requestAnimationFrame(render);
        studioAnalyser.getByteFrequencyData(dataArray);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let sum = 0;
        const barWidth = (canvas.width / bufferLength) * 2.5;
        let barHeight;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          barHeight = (dataArray[i] / 255) * canvas.height;
          sum += dataArray[i];

          ctx.fillStyle = '#ef4444';
          ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 1;
        }

        const average = sum / bufferLength;
        const scale = 1 + (average / 128) * 0.4;
        if (micHalo) {
          micHalo.style.transform = `scale(${scale})`;
        }
      }
      render();
    }

    async function startMasterStudioRecording() {
      try {
        studioMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(studioMicStream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = processStudioMasterRecording;

        studioAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        studioAnalyser = studioAudioCtx.createAnalyser();
        const source = studioAudioCtx.createMediaStreamSource(studioMicStream);
        source.connect(studioAnalyser);

        document.getElementById('recordingOverlay').classList.add('active');
        mediaRecorder.start();

        studioStartTime = Date.now();
        document.getElementById('recTimer').textContent = '00:00';
        studioTimerInterval = setInterval(updateStudioTimer, 1000);
      } catch (err) {
        showToast('Microphone access denied.');
      }
    }

    function updateStudioTimer() {
      const elapsedSec = Math.floor((Date.now() - studioStartTime) / 1000);
      const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
      const secs = String(elapsedSec % 60).padStart(2, '0');
      document.getElementById('recTimer').textContent = `${mins}:${secs}`;
    }

    function stopMasterStudioRecording() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
      clearInterval(studioTimerInterval);
      if (studioMicStream) {
        studioMicStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('recordingOverlay').classList.remove('active');
    }

    function processStudioMasterRecording() {
      studioMasterBlob = new Blob(audioChunks, { type: 'audio/webm' });
      saveBlobToDB('studioMasterBlob', studioMasterBlob);
      document.getElementById('studioAudioPlayback').src = URL.createObjectURL(studioMasterBlob);
      
      document.getElementById('masterRecordBtn').style.display = 'none';
      document.getElementById('studioRecordingResult').style.display = 'flex';
      showToast('Master recitation saved successfully.');
    }

    function resetStudioRecording() {
      studioMasterBlob = null;
      document.getElementById('studioAudioPlayback').src = '';
      document.getElementById('studioRecordingResult').style.display = 'none';
      document.getElementById('masterRecordBtn').style.display = 'block';
      showToast('Studio recording cleared.');
    }

    async function encodeBlobToMp3(blob) {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const arrayBuffer = await blob.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

      const channels = audioBuffer.numberOfChannels;
      const sampleRate = audioBuffer.sampleRate;
      const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
      const mp3Data = [];

      const sampleBlockSize = 1152;
      const left = audioBuffer.getChannelData(0);
      const right = channels > 1 ? audioBuffer.getChannelData(1) : left;

      const leftInt16 = new Int16Array(left.length);
      const rightInt16 = new Int16Array(right.length);

      for (let i = 0; i < left.length; i++) {
        leftInt16[i] = left[i] < 0 ? left[i] * 0x8000 : left[i] * 0x7FFF;
        rightInt16[i] = right[i] < 0 ? right[i] * 0x8000 : right[i] * 0x7FFF;
      }

      for (let i = 0; i < leftInt16.length; i += sampleBlockSize) {
        const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
        let mp3buf;
        if (channels === 2) {
          const rightChunk = rightInt16.subarray(i, i + sampleBlockSize);
          mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
        } else {
          mp3buf = mp3encoder.encodeBuffer(leftChunk);
        }
        if (mp3buf.length > 0) mp3Data.push(mp3buf);
      }

      const mp3buf = mp3encoder.flush();
      if (mp3buf.length > 0) mp3Data.push(mp3buf);

      audioCtx.close();
      return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function exportToMp3() {
      // a) Ensure every verse has been recorded
      if (Object.keys(recordedBlobs).length < totalVerses) {
        showToast('Record all verses before exporting MP3.');
        return;
      }
      showToast('Preparing MP3 export...');

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // b) Decode all verse WebM blobs into AudioBuffers
        const audioBuffers = [];
        for (let i = 1; i <= totalVerses; i++) {
          const arrayBuffer = await recordedBlobs[i].arrayBuffer();
          const decoded = await audioCtx.decodeAudioData(arrayBuffer);
          audioBuffers.push(decoded);
        }

        const sampleRate = audioBuffers[0].sampleRate;

        // c) Concatenate into a single mono Float32 AudioBuffer
        const totalLength = audioBuffers.reduce((acc, buf) => acc + buf.length, 0);
        const mergedBuffer = audioCtx.createBuffer(1, totalLength, sampleRate);
        const channelData = mergedBuffer.getChannelData(0);
        let offset = 0;
        for (const buf of audioBuffers) {
          channelData.set(buf.getChannelData(0), offset);
          offset += buf.length;
        }

        // d) Convert Float32 (-1.0..1.0) samples to 16-bit PCM Int16
        const samples = new Int16Array(totalLength);
        for (let i = 0; i < totalLength; i++) {
          const s = Math.max(-1, Math.min(1, channelData[i]));
          samples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        // e) Encode raw PCM into MP3 chunks via LameJS
        const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
        const sampleBlockSize = 1152;
        const mp3Data = [];
        for (let i = 0; i < samples.length; i += sampleBlockSize) {
          const chunk = samples.subarray(i, i + sampleBlockSize);
          const mp3buf = mp3encoder.encodeBuffer(chunk);
          if (mp3buf.length > 0) mp3Data.push(mp3buf);
        }
        const endBuf = mp3encoder.flush();
        if (endBuf.length > 0) mp3Data.push(endBuf);

        // f) Wrap in Blob and trigger download
        const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
        triggerDownload(mp3Blob, 'Surah_Al_Ikhlas_Personal_Recitation.mp3');

        // g) Cleanup and feedback
        audioCtx.close();
        showToast('MP3 export complete!');
      } catch (err) {
        showToast('MP3 export failed.');
      }
    }

    async function exportStudioMp3() {
      if (!studioMasterBlob) return;
      showToast('Exporting Studio MP3...');
      try {
        const mp3Blob = await encodeBlobToMp3(studioMasterBlob);
        triggerDownload(mp3Blob, 'Surah_Al_Ikhlas_Studio_Recitation.mp3');
        showToast('Studio MP3 export complete!');
      } catch (err) {
        showToast('Studio export failed.');
      }
    }

    function bufferToWavBlob(buffer) {
      return new Promise((resolve) => {
        const numOfChan = buffer.numberOfChannels;
        const length = buffer.length * numOfChan * 2 + 44;
        const out = new DataView(new ArrayBuffer(length));
        let channels = [];
        let sample = 0;
        let offset = 0;
        let pos = 0;

        function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

        setUint32(0x46464952);
        setUint32(length - 8);
        setUint32(0x45564157);
        setUint32(0x20746d66);
        setUint32(16);
        setUint16(1);
        setUint16(numOfChan);
        setUint32(buffer.sampleRate);
        setUint32(buffer.sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2);
        setUint16(16);
        setUint32(0x61746164);
        setUint32(length - pos - 4);

        for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

        while (offset < buffer.length) {
          for (let i = 0; i < numOfChan; i++) {
            sample = Math.max(-1, Math.min(1, channels[i][offset]));
            sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
            out.setInt16(pos, sample, true);
            pos += 2;
          }
          offset++;
        }
        resolve(new Blob([out.buffer], { type: 'audio/wav' }));
      });
    }
