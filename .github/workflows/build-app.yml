name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Initialize Node & Install Capacitor Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 5. Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html www/
          # Copy any audio or assets if they exist
          cp -r *.mp3 *.jpg *.png www/ 2>/dev/null || true

      - name: 6. Initialize & Configure Capacitor
        run: |
          npx cap init "Dhaka Azan" "com.dhaka.azan" --web-dir "www"
          npx cap add android

      - name: 7. Enable Autoplay, Recording & Permissions in Android Source
        run: |
          # Configure MainActivity to support autoplay and grant Web Chrome media/microphone requests
          MAIN_ACTIVITY_PATH="android/app/src/main/java/com/dhaka/azan/MainActivity.java"
          cat << 'EOF' > $MAIN_ACTIVITY_PATH
          package com.dhaka.azan;

          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebSettings settings = this.bridge.getWebView().getSettings();
                      settings.setMediaPlaybackRequiresUserGesture(false);
                      settings.setDomStorageEnabled(true);
                      settings.setAllowFileAccess(true);

                      // Enable native audio/microphone permission bridge for web media recorder
                      this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }
                      });
                  }
              }
          }
          EOF

          # Add standard audio, background & notification permissions to AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST_PATH

      - name: 8. Sync Capacitor Assets
        run: npx cap sync android

      - name: 9. Grant Execute Permissions to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 10. Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 11. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dhaka-Azan-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
